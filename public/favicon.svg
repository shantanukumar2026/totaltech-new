<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F7FF"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0055FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#blueGrad)"/>

  <!-- Inner crisp shape -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Stylized Geometric Modern "TT" Monogram -->
  <g filter="url(#glow)">
    <!-- First 'T' -->
    <path d="M120 160 H280 V220 H220 V360 H160 V220 H120 Z" fill="#FFFFFF"/>
    <!-- Second overlapping 'T' with cyan accent -->
    <path d="M240 160 H400 V220 H340 V360 H280 V220 H240 Z" fill="#E0F2FE"/>
    <!-- Top accent bar -->
    <rect x="140" y="140" width="240" height="14" rx="7" fill="#67E8F9"/>
  </g>
</svg>
